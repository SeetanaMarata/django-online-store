{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи - Блог{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">🗑️ Удаление статьи</h4>
                </div>
                <div class="card-body text-center">
                    <h5>Вы уверены, что хотите удалить статью?</h5>
                    <p class="text-muted">"{{ object.title }}"</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">✅ Да, удалить</button>
                            <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-outline-secondary">
                                ❌ Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
