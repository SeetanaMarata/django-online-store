<!-- templates/catalog/includes/footer.html -->
<footer class="bg-dark text-white mt-5 py-4">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h5>🛍️ Интернет-магазин</h5>
                <p class="mb-0">Лучшие товары по выгодным ценам</p>
            </div>
            <div class="col-md-6 text-md-end">
                <p class="mb-0">&copy; 2024 Интернет-магазин. Все права защищены.</p>
                <p class="mb-0">Телефон: +7 (999) 999-99-99</p>
                {% if user.is_staff or user.is_superuser %}
                <p class="mb-0 mt-2">
                    <small class="text-light">
                        🚀 Кеш: {% if cache_enabled %}🟢 Включен ({{ cache_ttl }} сек){% else %}🔴 Выключен{% endif %}
                    </small>
                </p>
                {% endif %}
            </div>
        </div>
    </div>
</footer>
